name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '25']
        bouncycastle: ['1.78.1', '1.84']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Check out Spiffing Java
        uses: actions/checkout@v4
        with:
          repository: dwd/spiffing-java
          ref: 60c474434fc57f9a1ecab7e9549773f3a6656614
          path: .build/spiffing-java
      - name: Build and install Spiffing
        run: mvn -B -f .build/spiffing-java/pom.xml install
      - name: Verify plugin
        run: mvn -B verify -Dbouncycastle.version=${{ matrix.bouncycastle }}
      - uses: actions/upload-artifact@v4
        with:
          name: spiffing-java-${{ matrix.java }}-bc-${{ matrix.bouncycastle }}
          path: target/spiffing-openfire-plugin-assembly.jar
